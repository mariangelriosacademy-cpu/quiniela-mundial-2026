.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,26,94,0.60) 0%, rgba(0,26,94,0.50) 50%, rgba(200,16,46,0.60) 100%); z-index: 0; }
.hero > * { position: relative; z-index: 1; }
.hero::before { content: '⚽'; position: absolute; font-size: 200px; opacity: 0.05; top: -20px; right: -20px; z-index: 1; }
.hero-badge { background: var(--dorado); color: var(--texto); display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; }
.hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
.hero h1 span { color: var(--dorado); }
.hero-sub { font-size: 1rem; opacity: 0.9; margin-bottom: 20px; }
.precio-badge { background: rgba(255,255,255,0.15); border: 2px solid var(--dorado); border-radius: 12px; display: inline-block; padding: 12px 24px; margin-bottom: 24px; }
.precio-badge .label { font-size: 12px; opacity: 0.8; }
.precio-badge .monto { font-size: 1.8rem; font-weight: 800; color: var(--dorado); }
.precio-badge .moneda { font-size: 12px; opacity: 0.8; }
.btn-principal { background: var(--dorado); color: var(--texto); border: none; padding: 16px 36px; font-size: 1.1rem; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
.btn-principal:hover { transform: scale(1.05); }
.section { padding: 32px 16px; max-width: 800px; margin: 0 auto; }
.section-title { font-size: 1.3rem; font-weight: 700; color: var(--azul); border-left: 4px solid var(--rojo); padding-left: 12px; margin-bottom: 20px; }
.pasos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media(max-width: 768px) { .pasos { grid-template-columns: repeat(2, 1fr); } }
@media(max-width: 480px) { .pasos { grid-template-columns: 1fr; } }
.paso { background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.paso-num { background: var(--rojo); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; margin: 0 auto 12px; }
.paso h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; }
.paso p { font-size: 0.82rem; color: #666; }
.pagos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.pago { background: white; border-radius: 12px; padding: 16px; text-align: center; border: 2px solid var(--gris); }
.pago .icon { font-size: 2rem; margin-bottom: 8px; }
.pago h4 { font-size: 0.85rem; font-weight: 600; }
.pago p { font-size: 0.75rem; color: #888; margin-top: 4px; }
.reglamento { background: white; border-radius: 16px; padding: 20px; }

.regla:last-child { border-bottom: none; }
